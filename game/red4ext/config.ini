version = 0

[dev]
console = false
wait_for_debugger = false
strict_version_check = true

[logging]
flush_on = "debug"
level = "info"
max_file_size = 10
max_files = 5

[plugins]
enabled = true
ignored = []

[hooking]
backend = "native_inline"
core_hooks = ["CGameApplication_AddState", "AssertionFailed"]
